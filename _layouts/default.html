{% assign t = site.data.i18n[page.lang] %}
<!doctype html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var s=localStorage.getItem("theme");if(s)document.documentElement.dataset.theme=s}catch(e){}</script>
  {% seo title=false %}
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="alternate" hreflang="{{ page.lang }}" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{{ t.other }}" href="{{ page.alt | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ "/" | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main" class="container">
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
