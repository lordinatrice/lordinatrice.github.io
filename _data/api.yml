      {
        "status": "case by case",  // let’s talk
        "formats": ["lead", "audit", "consulting", "staffing"],
        "remote": true,
        "avg_response_time": "1h"
      }
    fr: |-
      {
        "status": "au cas par cas",  // parlons-en
        "formats": ["lead", "audit", "conseil", "staffing"],
        "remote": true,
        "avg_response_time": "1h"
      }
