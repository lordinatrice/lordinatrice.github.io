  status: 200 OK
  tone: ok
  body:
    en: |-
      {
        "name": "Camille Regnault",
        "alias": "L’Ordinatrice",
        "role": "Lead Rails & API",
        "experience_years": 7,
        "stack": ["Rails", "Hotwire", "REST", "GraphQL"],
        "remote": true,
        "bugs_introduced": 0  // that’s the goal, anyway
      }
    fr: |-
      {
        "name": "Camille Regnault",
        "alias": "L’Ordinatrice",
        "role": "Lead Rails & API",
        "experience_years": 7,
        "stack": ["Rails", "Hotwire", "REST", "GraphQL"],
        "remote": true,
        "bugs_introduced": 0  // on vise, en tout cas
      }
- path: /availability
  status: 200 OK
  tone: ok
